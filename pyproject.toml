[project]
name = "odyssey-models"
version = "0.1.0"
description = "Model microservices: embed · stt · speaker · tts"
requires-python = ">=3.11"

# Chung cho embed. stt/tts/speaker KHÔNG dùng file này — chúng giữ requirements
# riêng trong Dockerfile/requirements.txt của mình.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "numpy",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers",
    "transformers",
    "torch",
    "fastembed",
    "huggingface_hub",
    "Pillow",
    "sentencepiece",
    "protobuf",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx2",
    "websockets>=14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["embed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
# Ngoài phạm vi lint: stt/tts/speaker giữ style riêng, không đụng.
exclude = ["stt", "speaker",
           "lipsync_musetalk/musetalk"]  # code MuseTalk chép nguyên (MIT) — xem VENDORED.md

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

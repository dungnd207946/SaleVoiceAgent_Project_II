# File DEPLOY (dev-server + prod). Máy dev dùng docker-compose.local.yml.
# Không có postgres/minio: ở đây là Aurora PostgreSQL và S3.
#
#   docker network create odyssey-network      # một lần mỗi máy, tạo tay
#   IMAGE_TAG=<sha> docker compose -f docker-compose.dev.yml pull
#   IMAGE_TAG=<sha> docker compose -f docker-compose.dev.yml run --rm migrate
#   IMAGE_TAG=<sha> docker compose -f docker-compose.dev.yml up -d --wait
name: odyssey-portal-backend

services:
  redis:
    image: redis:7-alpine
    # Dùng chung file env với backend: REDIS_PASSWORD ở đó, cạnh REDIS_URL — một chỗ
    # để đổi mật khẩu.
    env_file:
      - deploy/odyssey-portal-backend.env
    # `$$` để compose KHÔNG nội suy — shell trong container mới mở biến ra (compose
    # không đọc được biến từ `env_file` lúc nội suy `command`).
    # `:?` làm container chết ngay nếu biến rỗng/thiếu: `--requirepass ""` là một
    # Redis KHÔNG mật khẩu trên network dùng chung, và nó khởi động im lặng.
    # `--appendonly yes` đi kèm volume, không có nó thì volume chỉ là thư mục rỗng.
    command:
      - sh
      - -c
      - ': "$${REDIS_PASSWORD:?chưa có trong deploy/odyssey-portal-backend.env}"; exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis-data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped
    # ⚠️ KHÔNG bật xác thực ở đây cho tới khi làm đủ bước 1–2 của
    # `docs/contracts/dau-noi-agent.md` §"Bật xác thực Qdrant".
    #
    # Bỏ comment hai dòng dưới là BẮT ĐẦU CƯỠNG CHẾ NGAY: mọi pod agent nối
    # không kèm khoá `403` từ giây đó, và credential chúng đang giữ có thể còn
    # hiệu lực tới một giờ nữa — tức không tự khỏi bằng cách chờ.
    #
    # Chuỗi này phải TRÙNG `QDRANT_API_KEY` mà portal đang dùng (Qdrant verify
    # JWT của pod bằng đúng nó). Không có khoá ký thứ hai.
    # environment:
    #   QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?bat buoc khi bat xac thuc}
    #   QDRANT__SERVICE__JWT_RBAC: "true"

  # Một image, hai vai — migration và runtime phải cùng một bản code (README §8).
  migrate:
    # `up --wait` KHÔNG được thấy service này: nó sẽ (1) chạy migration lần hai sau
    # `run --rm migrate`, và (2) trả exit 1 vì `--wait` coi container thoát — kể cả
    # exit 0 — là thất bại. `run --rm migrate` tự bật profile nên vẫn chạy bình thường.
    profiles: ["migration"]
    image: 418295696099.dkr.ecr.ap-southeast-1.amazonaws.com/aidc/odyssey-portal-backend:${IMAGE_TAG:-dev-latest}
    command: ["migrate"]
    # HAI file env chứ không một: entrypoint từ chối vai `serve` nếu thấy
    # MIGRATOR_URL. Dùng chung một file thì không có gì báo sai — container xanh,
    # request 200, chỉ là RLS mất hiệu lực (README §1-§2).
    env_file:
      - deploy/odyssey-portal-migrate.env
    restart: "no"

  # Định giá usage → tiền. Gọi từ systemd timer, KHÔNG từ pipeline deploy.
  # Xem deploy/systemd/README.md.
  #
  # LƯỚI AN TOÀN, không phải đường chính: từ `0950` tiền được tính trong chính câu
  # INSERT vào `usage_events` (trigger `usage_events_dinh_gia`). Vai này vá ba lỗ
  # trigger không với tới — xem deploy/systemd/README.md.
  #
  #   docker compose -f docker-compose.dev.yml run --rm dinh-gia dinh-gia
  #                                                   ^service      ^vai entrypoint
  #
  # Hai chữ `dinh-gia` KHÔNG phải lỗi copy: cái đầu là tên service của compose,
  # cái sau là vai truyền cho entrypoint. `run --rm <service> <args>` THAY THẾ
  # `command:` bên dưới, nên vai phải được viết lại — bỏ nó đi là container chạy
  # `--gio 1` như tên vai và entrypoint `chet` với "vai không hợp lệ".
  dinh-gia:
    # Cùng lý lẽ profile với `migrate`: `up --wait` không được thấy service này
    # (nó thoát sau khi định giá xong, và `--wait` coi container thoát là lỗi).
    profiles: ["billing"]
    image: 418295696099.dkr.ecr.ap-southeast-1.amazonaws.com/aidc/odyssey-portal-backend:${IMAGE_TAG:-dev-latest}
    # Không cờ ⇒ cửa sổ mặc định 48h, đúng nhịp hằng đêm. `--gio N` / `--tu/--den`
    # override được ở dòng lệnh khi cần chạy tay một cửa sổ khác.
    command: ["dinh-gia"]
    # File env của MIGRATE: `rate_usage()` định giá cho MỌI tenant (p_tenant NULL),
    # là thao tác cấp nền tảng — xem docstring `portal/cli/dinh_gia_usage.py`.
    # Entrypoint từ chối vai này nếu thiếu MIGRATOR_URL.
    env_file:
      - deploy/odyssey-portal-migrate.env
    restart: "no"

  # Owner đầu tiên của môi trường — MỘT LẦN, chạy tay sau `migrate` lần đầu.
  # Không nằm trong pipeline deploy có chủ đích: nó in ra một link mời chỉ dùng
  # được một lần, và một job tự chạy mỗi lần deploy sẽ hoặc in lại link vô ích
  # (đã có user active → script tự từ chối), hoặc chôn nó trong log của lần deploy
  # thứ 40 mà không ai đọc.
  #
  #   SEED_OWNER_EMAIL=... SEED_ORG_ID=... \
  #     docker compose -f docker-compose.dev.yml run --rm seed-owner
  seed-owner:
    # Cùng lý lẽ profile với `migrate`: `up --wait` không được thấy service này.
    profiles: ["seed"]
    image: 418295696099.dkr.ecr.ap-southeast-1.amazonaws.com/aidc/odyssey-portal-backend:${IMAGE_TAG:-dev-latest}
    command: ["seed-owner"]
    # File env của BACKEND, không phải của migrate: việc ở đây là DML trên schema
    # `control` bằng role runtime. Entrypoint từ chối vai này nếu thấy MIGRATOR_URL.
    env_file:
      - deploy/odyssey-portal-backend.env
    # Bốn biến truyền lúc chạy, không nằm trong file env: chúng chỉ có nghĩa cho
    # đúng một lần chạy này, và để trong file env là để lại cấu hình chết mà lần
    # deploy sau đọc phải.
    environment:
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      SEED_ORG_ID: ${SEED_ORG_ID:-}
      SEED_ORG_NAME: ${SEED_ORG_NAME:-}
      SEED_PORTAL_URL: ${SEED_PORTAL_URL:-}
    restart: "no"

  backend:
    image: 418295696099.dkr.ecr.ap-southeast-1.amazonaws.com/aidc/odyssey-portal-backend:${IMAGE_TAG:-dev-latest}
    # Tên nginx của repo frontend trỏ tới (ODYSSEY_PORTAL_API_UPSTREAM).
    container_name: odyssey-portal-backend
    env_file:
      - deploy/odyssey-portal-backend.env
    ports:
      - "${PORTAL_API_PORT:-8100}:8100"
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      # KHÔNG `migrate: service_completed_successfully`: với `run --rm` compose
      # không thấy migrate completed nên `up` chạy migration lần hai, tranh khoá DDL.
    restart: unless-stopped

  # Hàng đợi `control.jobs`. Thêm 2026-08-05 — README §8.4 đặt điều kiện "cùng lúc
  # với `jobs.py` đầu tiên", và `modules/kb/jobs.py` đã tới.
  #
  # KHÔNG có `ports`: worker không phục vụ HTTP. Không có `container_name`: nginx của
  # repo frontend không trỏ vào nó, và tên cố định là thứ chặn chạy nhiều bản — mà
  # nhiều bản ở đây là AN TOÀN và có lúc cần (`FOR UPDATE SKIP LOCKED`, xem
  # portal/core/jobs.py), nên đừng khoá lại bằng một cái tên.
  #
  # CHUNG file env với `backend`: cùng role `portal_api`, cùng bị entrypoint chặn
  # MIGRATOR_URL. Devops không phải cấp thêm credential nào cho service này.
  worker:
    image: 418295696099.dkr.ecr.ap-southeast-1.amazonaws.com/aidc/odyssey-portal-backend:${IMAGE_TAG:-dev-latest}
    command: ["worker"]
    # HEALTHCHECK của image là của vai `serve` (gọi /healthz) — worker không phục
    # vụ HTTP, thừa kế check đó là unhealthy sau 3 lượt và `up --wait` đánh đỏ cả
    # job deploy dù worker chạy tốt (đã xảy ra: deploy 478d579f, 2026-08-05).
    # Disable chứ KHÔNG chế một check giả (kiểu pgrep): image slim không có procps,
    # và một phép kiểm không đo được "worker còn poll DB" thì chỉ dạy người đọc
    # tin nhầm — cùng lý lẽ entrypoint.sh không kiểm REDIS_URL cho vai worker.
    healthcheck:
      disable: true
    env_file:
      - deploy/odyssey-portal-backend.env
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped

  # Worker RIÊNG của kb/web (`kbweb_run`/`kbweb_project` + lịch theo tenant) — chạy mãi, tách khỏi `worker` ở trên
  # vì nhịp/tải khác hẳn (trafilatura + LLM + Gemini). File env RIÊNG
  # (odyssey-portal-crawl.env): key DashScope/Gemini của crawl không dùng chung
  # với phần khác (giới hạn tốc độ tính theo tài khoản/project).
  #
  # profiles: ["crawl"] — CÙNG profile với service `crawl` bên dưới, KHÔNG mặc
  # định như `worker`. `env_file` là lỗi CỨNG nếu file không tồn tại (khác biến
  # thiếu trong file, vốn chỉ rỗng) — một host chưa tạo
  # deploy/odyssey-portal-crawl.env (chưa opt-in kb/web) sẽ làm `docker compose
  # up -d` hỏng cho MỌI service, kể cả những service không liên quan gì tới
  # crawl. Đứng sau profile thì compose bỏ qua service này hoàn toàn khi không
  # ai gọi `--profile crawl`, kể cả việc đọc `env_file` của nó.
  crawl-worker:
    profiles: ["crawl"]
    # tag `-crawl`: cùng code, thêm Chromium cho tầng trình duyệt (Dockerfile tầng `crawl`)
    image: 418295696099.dkr.ecr.ap-southeast-1.amazonaws.com/aidc/odyssey-portal-backend:${IMAGE_TAG:-dev-latest}-crawl
    command: ["crawl-worker"]
    env_file:
      - deploy/odyssey-portal-crawl.env
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped

  # Chuỗi đêm/tuần/dựng lại của kb/web cho MỘT tenant, chạy TAY (backfill, dựng lại) — lịch thật
  # do crawl-worker tự đọc từ tenant_data.kbweb_schedules, không còn systemd timer
  # (deploy/systemd/README.md). Cùng lý lẽ profile với `dinh-gia`/`migrate`:
  # `up --wait` không được thấy service này (nó thoát sau khi chạy xong).
  #
  #   docker compose -f docker-compose.dev.yml run --rm crawl crawl --tenant T [--weekly|--rebuild|...]
  #                                                    ^service ^vai entrypoint
  crawl:
    profiles: ["crawl"]
    image: 418295696099.dkr.ecr.ap-southeast-1.amazonaws.com/aidc/odyssey-portal-backend:${IMAGE_TAG:-dev-latest}-crawl
    command: ["crawl"]
    env_file:
      - deploy/odyssey-portal-crawl.env
    cpus: "1.0"
    mem_limit: 1g
    restart: "no"

volumes:
  redis-data:
  qdrant-storage:

networks:
  default:
    name: odyssey-network
    external: true

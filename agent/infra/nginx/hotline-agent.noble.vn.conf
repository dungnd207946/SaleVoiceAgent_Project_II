# Nginx vhost — santa-hotline-agent
#
# Routes three logical paths:
#   /                   → agent HTTP/WS (port 8768)  — static UI + control
#   /livekit/token      → agent HTTP    (port 8768)  — JWT issuer (exact match)
#   /livekit/*          → livekit-server (port 7880) — WSS signaling + HTTP API
#
# TLS is managed by Certbot — run `sudo certbot --nginx -d hotline-agent.noble.vn`
# after first install; Certbot will rewrite the listen 443 / ssl_* blocks.

server {
    server_name hotline-agent.noble.vn;

    # Token endpoint lives on the agent (port 8768), not the LiveKit server.
    # Exact match wins over the /livekit/ prefix below.
    location = /livekit/token {
        proxy_pass http://127.0.0.1:8768;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LiveKit RTC signaling (WebSocket + HTTP). Strips the /livekit prefix
    # so the server sees paths like /rtc, /rtc/validate, /twirp/... directly.
    location /livekit/ {
        proxy_pass http://127.0.0.1:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else → the hotline agent (static UI, /livekit.html,
    # /api/*, legacy aiortc WS upgrade).
    location / {
        proxy_pass http://127.0.0.1:8768;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    listen 80;
}

# File của MÁY DEV — đủ hạ tầng bằng container, chạy offline. File deploy là
# docker-compose.dev.yml (không có postgres/minio).
#
# ⚠️ MÁY DEV DÙNG CHUNG: dự án KHÁC (`odyssey-portal-backend`) đang chạy postgres/redis/
# qdrant/minio ở 5442/6382/6343/9002 với network `odyssey-network`. Mọi default dưới
# đây là của dự án NÀY (`pj2-backend`, 5452/6392/6353/9012, `pj2-network`) — nguồn sự
# thật vẫn là `.env`. Default trỏ sang dự án kia là migrate/ghi nhầm DB người khác mà
# không có lỗi nào.
#
# Cần `docker network create pj2-network` trước.
name: pj2-backend

services:
  postgres:
    # Đổi tag ở đây thì đổi cả tests/conftest.py.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${PORTAL_PG_USER:-portal_migrator}
      POSTGRES_PASSWORD: ${PORTAL_PG_PASSWORD:-dev}
      POSTGRES_DB: ${PORTAL_PG_DB:-portal}
    ports: ["${PORTAL_PG_PORT:-5452}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PORTAL_PG_USER:-portal_migrator} -d ${PORTAL_PG_DB:-portal}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${PORTAL_REDIS_PASSWORD:-devredis}"]
    ports: ["${PORTAL_REDIS_PORT:-6392}:6379"]

  # Không volume nào trong file này — `make reset` xoá được sạch mọi kho.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${PORTAL_QDRANT_PORT:-6353}:6333"
      - "${PORTAL_QDRANT_GRPC_PORT:-6354}:6334"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    # Cùng cặp khoá với S3_ACCESS_KEY/S3_SECRET_KEY: lệch nhau là 403 lúc phát tệp.
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${PORTAL_MINIO_PORT:-9012}:9000"
      - "${PORTAL_MINIO_CONSOLE_PORT:-9013}:9001"

  # ═══ Ứng dụng — profile `app`, KHÔNG chạy mặc định ═════════════════════════
  # `make dev` chỉ dựng hạ tầng; API chạy trên host bằng `make api`. Chạy trong container:
  #   make dev && make migrate && make grant-api-dev
  #   docker compose -f docker-compose.local.yml --profile app up -d --wait

  migrate:
    profiles: ["app"]
    build: .
    command: ["migrate"]
    environment:
      MIGRATOR_URL: postgresql://${PORTAL_PG_USER:-portal_migrator}:${PORTAL_PG_PASSWORD:-dev}@postgres:5432/${PORTAL_PG_DB:-portal}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    profiles: ["app"]
    build: .
    environment: &app_env
      # KHÔNG khai MIGRATOR_URL: entrypoint từ chối vai `serve`/`worker` nếu thấy nó.
      # HOST là tên service, không phải localhost.
      DATABASE_URL: postgresql://${PORTAL_API_DB_USER:-portal_api}:${PORTAL_API_DB_PASSWORD:-apidev}@postgres:5432/${PORTAL_PG_DB:-portal}
      REDIS_URL: redis://:${PORTAL_REDIS_PASSWORD:-devredis}@redis:6379/${PORTAL_REDIS_DB:-0}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-shop}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      KB_EMBED_URL: ${KB_EMBED_URL:-}
      KB_SANTA_MODELS_TOKEN: ${KB_SANTA_MODELS_TOKEN:-}
      KB_VLM_API_KEY: ${KB_VLM_API_KEY:-}
      KB_VLM_BASE_URL: ${KB_VLM_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
    ports:
      # Khác PORTAL_API_PORT (cổng `make api` trên host) để hai đường chạy cùng lúc.
      - "${PORTAL_API_DOCKER_PORT:-8111}:8100"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Hàng đợi `shop.jobs` (index Qdrant, bóc chữ tài liệu). Trên host thì `make worker`.
  worker:
    profiles: ["app"]
    build: .
    command: ["worker"]
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

networks:
  default:
    name: ${PORTAL_DOCKER_NETWORK:-pj2-network}
    external: true

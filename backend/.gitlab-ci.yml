stages: [lint, test, build, deploy]

# Ba môi trường: dev (`develop`), uat (`uat`) và prod (`prod`). Không có pipeline cho MR,
# nên các cổng ở stage `test` chạy SAU khi merge — thêm
# `- if: $CI_PIPELINE_SOURCE == "merge_request_event"` nếu muốn chặn ngay ở MR.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "uat"
      variables:
        LINT_RUNNER: odyssey-uat-runner
    - if: $CI_COMMIT_BRANCH == "prod"

variables:
  APP_NAME: aidc/odyssey-portal-backend
  AWS_DEFAULT_REGION: ap-southeast-1
  ECR_URL: 418295696099.dkr.ecr.ap-southeast-1.amazonaws.com
  IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  UV_IMAGE: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  LINT_RUNNER: odyssey-dev-runner # uat đè thành odyssey-uat-runner ở workflow

# ⚠️ Runner là SHELL executor → GitLab BỎ QUA `image:`, job chạy thẳng trên host.
# Nên mọi lệnh python gọi tường minh qua `docker run`:
#   -u $(id -u):$(id -g)  file sinh ra (.venv, __pycache__) thuộc user runner chứ
#                         không phải root — nếu không `git clean` job sau gãy permission
#   -e HOME/UV_CACHE_DIR  uv cần chỗ ghi cache
#   --network host        testcontainers map cổng ra HOST, tiến trình test phải thấy
#                         `localhost:<cổng đã map>` y như khi chạy trên host
#   -v docker.sock        testcontainers dựng container anh em qua docker của host
#
# KHÔNG đặt TESTCONTAINERS_RYUK_DISABLED. Ryuk là container dọn rác của
# testcontainers: nó theo dõi phiên test và xoá các container postgres/redis/qdrant/
# minio khi phiên chết. Cấu hình dind cũ phải tắt nó; với docker.sock của host thì nó
# chạy được — và cần chạy, vì job bị cancel/kill mà không có Ryuk sẽ để lại container
# nằm lại VĨNH VIỄN trên máy runner (cũng là máy deploy), mỗi lần một bộ 4 cái.
.uv:
  tags:
    - ${LINT_RUNNER}
  before_script:
    - docker pull ${UV_IMAGE}

lint:
  extends: .uv
  stage: lint
  script:
    # Cache uv nằm trên host để lượt sau không tải lại; timeout dài vì mạng runner chập chờn.
    - mkdir -p "$HOME/.cache/uv"
    - >
      docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e UV_CACHE_DIR=/tmp/.uv
      -e UV_HTTP_TIMEOUT=300 -e UV_HTTP_RETRIES=10
      -v "$HOME/.cache/uv":/tmp/.uv
      -v "$CI_PROJECT_DIR":/app -w /app ${UV_IMAGE}
      sh -c "uv sync --frozen && uv run ruff check . && uv run ruff format --check ."


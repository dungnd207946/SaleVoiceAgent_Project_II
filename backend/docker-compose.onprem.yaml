# File DEPLOY cho SERVER ON-PREM. Máy dev dùng docker-compose.local.yml.
#
# ⚠️ Phải thêm vào deploy/odyssey-portal-backend.env (biến GitLab ODYSSEY_SECRET_BACKEND_ENV):
#      POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
#      MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
#      S3_ENDPOINT_URL=http://minio:9000     rỗng = gọi ra AWS thật
#      S3_ACCESS_KEY / S3_SECRET_KEY         PHẢI là credential ROOT của MinIO —
#        enrollment/ha_tang.py dùng đúng hai biến này cho `MinioAdmin` để cấp access
#        key per-tenant; key thường không có quyền admin, hỏng ở bước cấp phát tenant.
#      S3_REGION=us-east-1                   khác giá trị này thì phải set
#        MINIO_SITE_REGION cho service minio cho khớp, không thì lệch chữ ký.
#    DATABASE_URL / MIGRATOR_URL trỏ host `postgres:5432`, không còn endpoint Aurora.
#      KB_VLM_API_KEY / KB_GEMINI_API_KEY / KB_EMBED_URL / KB_SANTA_MODELS_TOKEN
#        cho `crawl-worker` (màn «Dữ liệu ngoài», 2026-10-05) — cùng file env với backend.
name: odyssey-portal-backend

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - deploy/odyssey-portal-backend.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PORTAL_PG_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  minio:
    # `minio/minio` đã biến khỏi Docker Hub (2026-09-29) → dùng bản mirror trên ECR.
    image: 418295696099.dkr.ecr.ap-southeast-1.amazonaws.com/aidc/minio:latest
    env_file:
      - deploy/odyssey-portal-backend.env
    entrypoint:
      - sh
      - -c
      - ': "$${MINIO_ROOT_USER:?chưa có trong deploy/odyssey-portal-backend.env}"; : "$${MINIO_ROOT_PASSWORD:?chưa có trong deploy/odyssey-portal-backend.env}"; exec minio server /data --console-address ":9001"'
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${PORTAL_MINIO_PORT:-9002}:9000"
      - "127.0.0.1:${PORTAL_MINIO_CONSOLE_PORT:-9003}:9001"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    env_file:
      - deploy/odyssey-portal-backend.env
    command:
      - sh
      - -c
      - ': "$${REDIS_PASSWORD:?chưa có trong deploy/odyssey-portal-backend.env}"; exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis-data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${PORTAL_QDRANT_PORT:-6343}:6333"
      - "${PORTAL_QDRANT_GRPC_PORT:-6344}:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

  migrate:
    profiles: ["migration"]
    image: 418295696099.dkr.ecr.ap-southeast-1.amazonaws.com/aidc/odyssey-portal-backend:${IMAGE_TAG:-dev-latest}
    command: ["migrate"]
    # File RIÊNG, dù cả hai file sinh ra từ MỘT biến GitLab: entrypoint từ chối vai
    # serve/worker/seed-owner nếu thấy MIGRATOR_URL, nên biến đó chỉ được nằm trong
    # file này. fetch_secrets.sh lọc và tách hộ.
    env_file:
      - deploy/odyssey-portal-migrate.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: 418295696099.dkr.ecr.ap-southeast-1.amazonaws.com/aidc/odyssey-portal-backend:${IMAGE_TAG:-dev-latest}
    container_name: odyssey-portal-backend
    env_file:
      - deploy/odyssey-portal-backend.env
    ports:
      - "${PORTAL_API_PORT:-8100}:8100"
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  worker:
    image: 418295696099.dkr.ecr.ap-southeast-1.amazonaws.com/aidc/odyssey-portal-backend:${IMAGE_TAG:-dev-latest}
    command: ["worker"]
    healthcheck:
      disable: true
    env_file:
      - deploy/odyssey-portal-backend.env
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  # Worker RIÊNG của kb/web (màn «Dữ liệu ngoài»): lịch theo tenant + job `kbweb_run`/
  # `kbweb_project`/`kbweb_probe`. Image tag `-crawl` (cùng code + Chromium cho tầng trình
  # duyệt). Chạy mãi như `worker`, cùng env file; không còn systemd timer nào.
  # `shm_size`: Chromium cần /dev/shm > 64 MB mặc định của Docker, không thì crash khi render.
  crawl-worker:
    image: 418295696099.dkr.ecr.ap-southeast-1.amazonaws.com/aidc/odyssey-portal-backend:${IMAGE_TAG:-dev-latest}-crawl
    command: ["crawl-worker"]
    healthcheck:
      disable: true
    env_file:
      - deploy/odyssey-portal-backend.env
    shm_size: 512m
    cpus: "1.5"
    mem_limit: 2g
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  qdrant-storage:
  pgdata:
  minio-data:

networks:
  default:
    name: odyssey-network
    external: true
